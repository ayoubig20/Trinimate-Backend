include "application.local.conf"

ktor {
    deployment { port = 8080 }
    application {
        modules = [ com.trinimate.ApplicationKt.module ]
    }
}
database {
    url = "jdbc:postgresql://localhost:5432/trinimate"
    user = "postgres"
    # NO password here — it lives in application.local.conf
    driver = "org.postgresql.Driver"
}
jwt {
    # NO secret here — it lives in application.local.conf
    issuer = "trinimate"
    audience = "trinimate-app"
    realm = "trinimate"
}